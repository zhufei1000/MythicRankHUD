name: Release MythicRankHUD

# 打不带 "v" 前缀的版本号 tag 触发，例如: git tag 1.3.23 && git push origin 1.3.23
# CurseForge 的文件版本号取自 tag 名，保持与 TOC 的 ## Version 一致。
# Triggered by pushing a plain version tag (no "v" prefix), e.g. 1.3.23.
# The CurseForge file version comes from the tag name.
on:
  push:
    tags:
      - "[0-9]*.*"

permissions:
  contents: write # allow GITHUB_TOKEN to publish GitHub Releases

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # CurseForge upload token (repo secret CF_API_KEY, created on the
      # CurseForge website under Settings -> Upload API Tokens).
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      # Auto-provided by GitHub; used to attach the zip to a GitHub Release.
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for automatic changelogs

      - name: Run Lua tests
        run: |
          sudo apt-get -y update > /dev/null
          sudo apt-get -y install lua5.3 > /dev/null
          cd MythicRankHUD
          for t in tests/*_test.lua; do
            echo "::group::$t"
            lua5.3 "$t"
            echo "::endgroup::"
          done

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          # Only package the international variant; QFXMythicRankHUD is not
          # published on CurseForge.
          args: -t MythicRankHUD
